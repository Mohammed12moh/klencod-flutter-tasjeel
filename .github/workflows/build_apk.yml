name: Build Tasjeel APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # هذه الخطوة هي الحل: تولّد ملفات Gradle الناقصة (build.gradle,
      # settings.gradle, gradlew, gradle-wrapper.jar) تلقائياً من داخل
      # Flutter SDK نفسه، ولا تلمس lib/ أو pubspec.yaml أو الملفات
      # الموجودة أصلاً مثل AndroidManifest.xml و MainActivity.kt.
      - name: Generate missing Android project files
        run: flutter create . --platforms=android --project-name=tasjeel --org=com.tasjeel

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icon
        run: flutter pub run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tasjeel-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
